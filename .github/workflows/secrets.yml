name: secrets
on:
  pull_request_target:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
  pull-requests: read
jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the protected base branch (reviewed secrets baseline)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base
          persist-credentials: false
      - name: Check out the pull request tree as data only
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: pr
          persist-credentials: false
      - name: List changed files
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: gh api "repos/$REPO/pulls/$PR/files" --paginate --jq '.[] | select(.status != "removed") | .filename' > changed.txt
      - name: Scan changed files against the base baseline
        run: |
          python3 -m pip install --quiet detect-secrets==1.5.0
          cp base/.secrets.baseline pr/.secrets.baseline
          cd pr
          if [ -s ../changed.txt ]; then
            xargs -a ../changed.txt detect-secrets-hook --baseline .secrets.baseline --disable-plugin HexHighEntropyString
          fi
